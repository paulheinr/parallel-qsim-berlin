# Settings for the rust runs on the inputs of the validation against DSim (experiments/validation-*.toml) and of later
# benchmarks on the same inputs: the configs input/v7.1/berlin-v7.1.<pct>pct.{pt,nopt}.config.yml, which read the
# same XML files as the DSim configs (see input/v7.1/README.md). The DSim counterpart is cluster-validation-dsim.toml.
#
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-validation.toml submit experiments/validation-it0.toml --dry-run
#
# Otherwise as cluster.toml. Relative paths are resolved against the repository root.

out_root = "output/experiments"

partitions_root = "../../shared-svn/projects/rust-qsim"

scenario_version = "v7.1"
# with pt (schedule-based teleportation); an experiment can set config = "input/{version}/berlin-{version}.{pct}pct.nopt.config.yml"
config_pattern = "input/{version}/berlin-{version}.{pct}pct.pt.config.yml"
network_pattern = "berlin-{version}/network/berlin-{version}.network.{method}.{parts:03d}.xml.zst"

binary = "src/main/rust/target/release/berlin_iterations_v7"

# Written to run.env, {version} and {pct} are replaced.
[run_env]
# rust writes no trips file: after the simulation, run-sim.sh writes output_trips.csv.zst and output_legs.csv.zst from
# output_experienced_plans.xml.zst with MATSim's TripsAndLegsCsvWriter from this jar. The newest match is copied into
# the experiment (trips-jar/<sha12>/), like the binary. Build with `./mvnw clean package -DskipTests` in matsim-berlin.
TRIPS_JAR = "../matsim-berlin/matsim-berlin-7.1-SNAPSHOT-*.jar"

[slurm]
partition = "cpu-genoa"
mail_user = "heinrich@vsp.tu-berlin.de"
mail_type = "FAIL"
default_time = "01:00:00"

# See cluster.toml.
[fetch]
host = "hlrn-genoa"
remote_repo = "scratch/iterations-rust/parallel-qsim-berlin"
target = "../../runs-svn/matsim-rust/iterations-vs-dsim-2026"
extra_files = ["runs/*/output/output_trips.csv.zst"]
