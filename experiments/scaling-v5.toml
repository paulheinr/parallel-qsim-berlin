# Scaling of berlin_iterations_v7 with 10 iterations, all runs without writing events.
#
#   uv run scripts/cluster/cluster.py submit experiments/scaling-v5.toml --dry-run
#
# Same grid and time limits as scaling-v4.toml, rerun with matsim-rust main after #325 and #326 (the revert of
# 3e477073, which made scaling-v4 slower with scoring on). The runs of scaling, scaling-v2, scaling-v3 (f91a7b2) and
# scaling-v4 (eec3c5f) are kept. build_info.json and description.md record the commit that Cargo.lock pins on the
# cluster. The counterpart with global sync is scaling-v5-gsync.toml.
#
# See scaling-v3.toml for the choice of the partition counts and the hardware.

comment = """
Rerun of scaling-v4 (same grid, same time limits) with matsim-rust main after PRs #325 and #326. scaling-v4 used
eec3c5f, scaling-v3 f91a7b2. The counterpart with global sync is scaling-v5-gsync.

Changes since eec3c5f:

- #326 reverts 3e477073 of #324 ("Make backpacks and vehicle occupants smaller"). With it, scaling-v4 with scoring on
  was slower than scaling-v3 at 32 and more partitions (1 %, 96 partitions: 40.9k instead of 66.2k). In the
  bisection on one node (output/commits/revert), the revert restored the RTR of f91a7b2 at 1 %/3 % with 96 and 192
  partitions. Not measured there: few partitions (P=1-8), where #324 had measured a gain of the smaller backpacks on
  a laptop. So this run should show the RTR of scaling-v3 at many partitions and the rest of #324 (typed
  subscriptions, no id round trips) at few.
- #325 updates the xml crate to 1.4.0 (one line in the XML events writer and a test). Events are off here.

Still included: #323 (spin-then-park barrier, only used with global sync) and the other commits of #324.
"""

iterations = 10
repetitions = 1

# Same as scaling-v3 and scaling-v4 (twice the longest elapsed time in scaling, rounded up to 15 minutes, at least
# 15 minutes).
[time_limit]
"0" = "00:15:00"
"1" = [[2, "00:30:00"], [192, "00:15:00"]]
"3" = [[1, "01:15:00"], [2, "01:00:00"], [8, "00:30:00"], [192, "00:15:00"]]
"10" = [[1, "04:15:00"], [2, "03:30:00"], [4, "01:30:00"], [8, "01:00:00"], [24, "00:45:00"], [96, "00:30:00"],
    [192, "00:15:00"]]

# A) Influence of scoring.
[[grid]]
pct = [1, 3, 10]
parts = [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 144, 192]
method = ["metis"]
scoring = [true, false]
events = [false]

# D) Synchronization without agents: empty population (0pct), only with scoring.
[[grid]]
pct = [0]
parts = [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 144, 192]
method = ["metis"]
scoring = [true]
events = [false]
