# The runs of dsim-scaling.toml (DSim, pct 0/1/3/10, 13 partition counts) on the networks of scaling-v6.toml
# (metis-minconn-const), to compare with rust on the same partitions. DSim always scores, so only scoring = true.
#
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-dsim.toml submit experiments/dsim-scaling-minconn.toml --dry-run
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-dsim.toml fetch dsim-scaling-minconn

comment = """
DSim (Java, the jar of dsim-scaling, matsim-berlin ff27314) on the networks berlin-v7.1.network.metis-minconn-const.<P>
of scaling-v6 instead of metis.<P>: METIS with MinConn, constant edge weights and at most 1.1 times the mean number of
links per partition. Same grid as dsim-scaling (pct 0/1/3/10, scoring on, 13 partition counts, 10 iterations).

With the same partitions in both engines, rust (scaling-v6) and DSim can be compared directly. Compared with
dsim-scaling, these runs show how much DSim gains from the new partitioning. How DSim decides which partitions are
neighbors (e.g. whether the pt links count) is not checked; matsim-rust counts only links with a main mode since
scaling-v6. Maximum number of neighbors over all links at 96 / 192 partitions: see the analysis
(iterations.partitions); over main-mode links 8 / 9 (metis: 14 / 13).
"""

iterations = 10
repetitions = 1

# About 2.5 times the longest elapsed time of the same pct and parts in dsim-scaling, rounded up to 15 minutes, at least
# 30 minutes (dsim-scaling: 0pct at most 3 min, 1pct 6, 3pct 18, 10pct 62 at 1 part, 52 at 2, 26 at 4, 19 at 8, 11-16
# from 16 on). Larger margin than for rust, because the traffic of the busiest partition is less balanced at few
# partitions in these networks.
[time_limit]
"0" = "00:30:00"
"1" = "00:30:00"
"3" = [[2, "00:45:00"], [192, "00:30:00"]]
"10" = [[1, "02:45:00"], [2, "02:15:00"], [4, "01:15:00"], [8, "01:00:00"], [48, "00:45:00"], [192, "00:30:00"]]

[[grid]]
pct = [0, 1, 3, 10]
parts = [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 144, 192]
method = ["metis-minconn-const"]
scoring = [true]
events = [false]
