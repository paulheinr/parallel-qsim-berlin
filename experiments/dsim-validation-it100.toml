# Validation of the traffic of rust against DSim, part it100, the DSim runs: 101 iterations (0 to 100) from plans
# without routes and without pt users, kinematicWaves and PassingQ, 96 partitions, 3 seeds at 1pct. The same runs with
# rust are validation-it100.toml. Inputs and the commands of a run: input/v7.1/README.md.
#
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-validation-dsim.toml submit experiments/dsim-validation-it100.toml --dry-run
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-validation-dsim.toml fetch dsim-validation-it100

comment = """
Validation of rust (validation-it100) against DSim with replanning, the DSim runs: 101 iterations (0 to 100) from the
plans berlin-v7.1-<pct>pct.plans-nopt-noroutes.xml.gz (persons with a pt leg in any plan removed, routes removed), so
that both engines route and replan on their own travel times. Compared are the trips of the last iteration
(berlin-v7.1-<pct>pct.output_trips.csv.zst, written by DSim itself) and the convergence.

Configs input/v7.1/berlin-v7.1-<pct>pct.nopt.dsim.config.xml (no transit), kinematicWaves and PassingQ, 96 threads on
the network metis-minconn-const.096 with dsim.partitioning = none (the same partitions as rust; 96 instead of 8 since
2026-11-11, as in dsim-validation-it0, because 8 is too slow), events off. ReRoute 0.2 and
SelectExpBeta 0.8 for all subpopulations; innovation off and score MSA from iteration 90
(replanning.fractionOfIterationsToDisableInnovation and scoring.fractionOfIterationsToStartScoreMSA = 0.9). Seeds 1, 2
and 3 at 1pct (global.randomSeed; the spread between seeds of one engine is the reference for the difference between
the engines), seed 1 at 3pct and 10pct.

Time limits are rough estimates, made for 8 partitions and kept for 96: at 8 partitions on Genoa, an iteration of
dsim-scaling-minconn (calibrated plans with routes) took 25/49/125 s at 1/3/10pct, so 101 iterations take about 40
min/1.4 h/3.5 h, plus the first iterations, which are congested because all routes are computed on free-flow travel
times. The limits are about 3 times that (at most the 12 h of cpu-genoa). At 96 partitions the mobsim is faster, so the
runs should end well before the limits.
"""

config = "input/{version}/berlin-{version}-{pct}pct.nopt.dsim.config.xml"
extra_args = [
    "--config:replanning.fractionOfIterationsToDisableInnovation=0.9",
    "--config:scoring.fractionOfIterationsToStartScoreMSA=0.9",
]
iterations = 101
repetitions = 1

[run_env]
PLANS = "../../shared-svn/projects/rust-qsim/berlin-{version}/{pct}pct/berlin-{version}-{pct}pct.plans-nopt-noroutes.xml.gz"

[time_limit]
"1" = "02:00:00"
"3" = "04:00:00"
"10" = "10:00:00"

[[grid]]
pct = [1]
parts = [96]
method = ["metis-minconn-const"]
scoring = [true]
events = [false]
traffic = ["kinematicWaves"]
link = ["PassingQ"]
seed = [1, 2, 3]

[[grid]]
pct = [3, 10]
parts = [96]
method = ["metis-minconn-const"]
scoring = [true]
events = [false]
traffic = ["kinematicWaves"]
link = ["PassingQ"]
seed = [1]
