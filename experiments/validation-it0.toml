# Validation of the traffic of rust against DSim, part it0: only the mobsim (iteration 0) with the calibrated plans of
# Berlin v7.1 with pt, for both traffic dynamics and both link dynamics, 96 partitions. The same runs with DSim are
# dsim-validation-it0.toml. Inputs and the commands of a run: input/v7.1/README.md.
#
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-validation.toml submit experiments/validation-it0.toml --dry-run
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-validation.toml fetch validation-it0

comment = """
Validation of rust against DSim (dsim-validation-it0), iteration 0 only: the mobsim with the calibrated output plans of
Berlin v7.1 (pt, 1/3/10pct), so that both engines simulate the same routes. Compared are the trips
(output_trips.csv.zst, written by MATSim's TripsAndLegsCsvWriter from the experienced plans of rust; DSim writes its
own), e.g. travel times per mode and the distributions per trip.

Grid: traffic dynamics queue and kinematicWaves x link dynamics FIFO and PassingQ, 96 partitions (network
metis-minconn-const.096, the same file and partitions for both engines), scoring on, events off, one run each with the
seed of the configs (4711).

Unlike the scaling experiments, rust reads the XML inputs of the calibrated MATSim runs (configs
input/v7.1/berlin-v7.1.<pct>pct.pt.config.yml, settings cluster-validation.toml) instead of the binpb files.

Changes against the first submission (2026-11-10, only 1pct queue/FIFO at 8 partitions, deleted on 2026-11-11): 96
partitions instead of 8 (faster; the results of rust do not depend on the partitioning), and matsim-rust with
matsim-vsp/matsim-rust#345, which writes the distance of network routes into the experienced plans like MATSim's
EventsToLegs (before, the trips of rust lacked the length of the end link of every car leg).

Why kinematicWaves/PassingQ matters: the plans are the output of the QSim calibration with kinematicWaves and PassingQ.
Locally at 1pct with queue/FIFO, rust had about 6 % more car hours than DSim (robust across seeds); one hypothesis is
that physics further away from the calibration fits the plans worse. The 3 and 10pct runs show whether the gap shrinks
with finer flow capacities.

Time limits are rough estimates: at 8 partitions, 1pct took 87 s with rust (59 s simulation, the rest writing the
trips) and 140 s with DSim on Genoa (2026-11-10); 3 and 10pct mostly add reading the XML inputs.
"""

iterations = 1
repetitions = 1

[time_limit]
"1" = "00:30:00"
"3" = "00:30:00"
"10" = "01:00:00"

[[grid]]
pct = [1, 3, 10]
parts = [96]
method = ["metis-minconn-const"]
scoring = [true]
events = [false]
traffic = ["queue", "kinematicWaves"]
link = ["FIFO", "PassingQ"]
