# The runs of scaling.toml (A) with DSim (Java), to compare with rust. DSim always scores, so only scoring = true.
#
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-dsim.toml submit experiments/dsim-scaling.toml --dry-run
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-dsim.toml collect dsim-scaling

iterations = 10
repetitions = 1

# Same guesses as for rust, adjust after a first submission.
[time_limit]
"1" = [[4, "01:00:00"], [192, "00:30:00"]]
"3" = [[4, "02:00:00"], [16, "01:00:00"], [192, "00:30:00"]]
"10" = [[1, "12:00:00"], [2, "08:00:00"], [4, "05:00:00"], [8, "03:00:00"], [16, "02:00:00"], [48, "01:30:00"],
    [192, "01:00:00"]]

[[grid]]
pct = [1, 3, 10]
parts = [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 144, 192]
method = ["metis"]
scoring = [true]
events = [false]
