# Validation of the traffic of rust and DSim against MATSim's QSim, part it0, the QSim runs: only the mobsim (iteration
# 0) with the calibrated plans of Berlin v7.1 with pt, for both traffic dynamics and both link dynamics. The same runs
# with rust are validation-it0.toml, with DSim dsim-validation-it0.toml. Inputs: input/v7.1/README.md.
#
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-validation-qsim.toml submit experiments/qsim-validation-it0.toml --dry-run
#   uv run scripts/cluster/cluster.py --settings scripts/cluster/cluster-validation-qsim.toml fetch qsim-validation-it0

comment = """
Reference runs with MATSim's QSim for the validation of rust (validation-it0) and DSim (dsim-validation-it0), iteration
0 only: the mobsim with the calibrated output plans of Berlin v7.1 (pt, 1/3/10pct). The plans come from the QSim
calibration, so QSim is the reference both other engines should match. Compared are the trips
(berlin-v7.1-<pct>pct.output_trips.csv.zst, written by MATSim itself).

Same jar (matsim-berlin bd866a1, OpenBerlinDSimBenchmark) and configs (input/v7.1/berlin-v7.1-<pct>pct.pt.dsim.config.xml)
as dsim-validation-it0, but with controller.mobsim = qsim and qsim.numberOfThreads = 12 as in the calibrated runs
(settings cluster-validation-qsim.toml). Grid: qsim.trafficDynamics queue and kinematicWaves x qsim.linkDynamics FIFO
and PassingQ, events off, one run each with the seed of the configs (4711).

The network is metis-minconn-const.096, the same file as for rust and DSim (QSim ignores its partition attributes), so
that the run ids are the same in all three experiments; parts = 96 only sets --threads (global.numberOfThreads, not
used by the mobsim).

Time limits as for DSim: locally, 1pct with 8 QSim threads took about 1 min (2026-11-11).
"""
iterations = 1
repetitions = 1

[time_limit]
"1" = "00:30:00"
"3" = "00:30:00"
"10" = "01:00:00"

[[grid]]
pct = [1, 3, 10]
parts = [96]
method = ["metis-minconn-const"]
scoring = [true]
events = [false]
traffic = ["queue", "kinematicWaves"]
link = ["FIFO", "PassingQ"]
