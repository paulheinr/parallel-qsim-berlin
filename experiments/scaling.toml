# Scaling of berlin_iterations_v7 with 10 iterations, all runs without writing events.
#
#   uv run scripts/cluster/cluster.py submit experiments/scaling.toml --dry-run
#
# The three questions are in one experiment, so runs that belong to several of them (e.g. 10pct, 64 parts, scoring on)
# run only once. Select them in runs.csv by pct/parts/scoring.
#
# Hardware (Lise, cpu-genoa): 2x AMD EPYC 9654 = 192 cores per node. Per socket 96 cores in 12 CCDs with 8 cores and
# 32 MB L3 each, 12 DDR5 channels. A socket is 1, 2 or 4 NUMA domains of 96, 48 or 24 cores depending on the BIOS
# setting NPS1/2/4 (check with `numactl -H` on a node). The simulation does not pin its threads.

iterations = 10
repetitions = 1

# Guesses for 10 iterations, adjust after a first submission, e.g.
#   --only pct=10 --only scoring=on --only parts=1,8,64,192
[time_limit]
"0" = "00:30:00"
"1" = [[4, "01:00:00"], [192, "00:30:00"]]
"3" = [[4, "02:00:00"], [16, "01:00:00"], [192, "00:30:00"]]
"10" = [[1, "12:00:00"], [2, "08:00:00"], [4, "05:00:00"], [8, "03:00:00"], [16, "02:00:00"], [48, "01:30:00"],
    [192, "01:00:00"]]

# A) Influence of scoring. Powers of two plus partition counts at the boundaries of the hardware:
#    24 = NUMA domain with NPS4 (3 CCDs), 48 = half socket (NPS2), 96 = one socket, 144 = one and a half sockets.
[[grid]]
pct = [1, 3, 10]
parts = [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 144, 192]
method = ["metis"]
scoring = [true, false]
events = [false]

# B) Influence of the partitioning, 1pct: every number of parts up to 64.
#[[grid]]
#pct = [1]
#parts = { from = 1, to = 64 }
#method = ["metis"]
#scoring = [true]
#events = [false]

# C) Influence of the partitioning, 10pct: every number of parts up to 192.
#[[grid]]
#pct = [10]
#parts = { from = 1, to = 192 }
#method = ["metis"]
#scoring = [true]
#events = [false]

# D) Synchronization without agents: empty population (0pct) on the same network and partitions as A. Only with
#    scoring, as in dsim-scaling, since without agents scoring does nothing.
[[grid]]
pct = [0]
parts = [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 144, 192]
method = ["metis"]
scoring = [true]
events = [false]
