# Scaling of berlin_iterations_v7 with 10 iterations and global sync: all partitions wait at a barrier in every time
# step (computational_setup.global_sync = true), instead of only exchanging messages with their neighbors.
#
#   uv run scripts/cluster/cluster.py submit experiments/scaling-v3-gsync.toml --dry-run
#
# Same pct and partition counts as scaling-v3.toml, but only scoring on and no events. Compare with the runs with
# scoring on of scaling-v3, which have global_sync = false. Both should use the same binary (matsim-rust f91a7b2), see
# build_info.json and description.md.

comment = """
Global sync on: every partition waits at a barrier of all partitions in every time step
(`computational_setup.global_sync = true`), not only for the messages of its neighbors. Scoring on, events off,
pct 0/1/3/10 and the 13 partition counts of scaling-v3, 10 iterations, one repetition.

The counterpart without global sync is the runs with scoring on in scaling-v3 (same grid, matsim-rust f91a7b2,
submitted 2026-10-18). The difference between the two is the cost of the global barrier (std::sync::Barrier) per time
step, which should grow with the number of partitions and matter most for 0pct and 1pct. With 1 partition the barrier
has a single participant, so these runs should match scaling-v3.
"""

iterations = 10
repetitions = 1

# The time limits of scaling-v3, but at least one hour: a barrier in each of the 129,600 steps of an iteration costs
# 2 minutes per iteration at 1 ms, and scaling-v2 needed only 1-7 minutes for the runs with 16 or more partitions.
[time_limit]
"0" = "01:00:00"
"1" = "01:00:00"
"3" = [[1, "01:15:00"], [192, "01:00:00"]]
"10" = [[1, "04:15:00"], [2, "03:30:00"], [4, "01:30:00"], [192, "01:00:00"]]

[[grid]]
pct = [0, 1, 3, 10]
parts = [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 144, 192]
method = ["metis"]
scoring = [true]
events = [false]
global_sync = [true]
