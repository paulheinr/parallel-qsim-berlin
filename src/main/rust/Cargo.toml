[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
matsim-rust = { path = "../../../../parallel_qsim_rust/matsim_rust", package = "matsim-rust" }
#matsim-rust = { git = "https://github.com/matsim-vsp/matsim-rust" }
csv = "1.4.0"
clap = { version = "4.5.54", features = ["derive"] }
tracing = "0.1.44"
nohash-hasher = "0.2.0"
ahash = "0.8.12"
serde_yaml = "0.9.34"
hotpath = "0.28"
rayon = "1.12.0"

[features]
# Profiling with hotpath (https://hotpath.rs); forwards to the simulation library.
hotpath = ["hotpath/hotpath", "matsim-rust/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc", "matsim-rust/hotpath-alloc"]