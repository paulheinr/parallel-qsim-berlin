# Same Metis options as the partitioning module in input/v7.1/*.config.yml.
# The file stem ("metis") is the method label used in network file names and experiment definitions.
!Metis
vertex_weight:
  - InLinkCount
edge_weight: Capacity
# Since matsim-rust c646f29c (branch main-mode-neighbors), imbalance_factor is the largest partition weight relative
# to the mean. Before, the value was the excess, so the 1.1 of the networks metis.<P> in shared-svn allowed 2.1 times the
# mean; 2.1 reproduces them with the new code.
imbalance_factor: 2.1
# Since matsim-rust 7fc31259 (main), MinConn is on by default; the networks metis.<P> were partitioned without it.
min_conn: false
